# PharmaConnect managed tenant public delivery (LiteSpeed / Apache front door)
# Proxies *.sites.pharmaconnect.uk to the generic nginx managed-sites router.

<VirtualHost 51.161.86.187:80>
    ServerName sites.pharmaconnect.uk
    ServerAlias *.sites.pharmaconnect.uk
    ServerAdmin servers@inboxingprohost.com
    UseCanonicalName Off

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:9080/
    ProxyPassReverse / http://127.0.0.1:9080/

    <Proxy http://127.0.0.1:9080/*>
        Require all granted
    </Proxy>

    ErrorLog /var/log/apache2/pharmaconnect-managed-sites-error.log
    CustomLog /var/log/apache2/pharmaconnect-managed-sites-access.log combined
</VirtualHost>

<VirtualHost 51.161.86.187:443>
    ServerName sites.pharmaconnect.uk
    ServerAlias *.sites.pharmaconnect.uk
    ServerAdmin servers@inboxingprohost.com
    UseCanonicalName Off

    SSLEngine on
    SSLCertificateFile /etc/pharmaconnect-managed-sites/ssl/fullchain.pem
    SSLCertificateKeyFile /etc/pharmaconnect-managed-sites/ssl/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:9080/
    ProxyPassReverse / http://127.0.0.1:9080/

    <Proxy http://127.0.0.1:9080/*>
        Require all granted
    </Proxy>

    ErrorLog /var/log/apache2/pharmaconnect-managed-sites-ssl-error.log
    CustomLog /var/log/apache2/pharmaconnect-managed-sites-ssl-access.log combined
</VirtualHost>

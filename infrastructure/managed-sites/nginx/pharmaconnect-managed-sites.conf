# PharmaConnect generic managed tenant sites
# Maps {tenant}.sites.pharmaconnect.uk and verified local.<customer-domain> hosts
# -> /var/www/pharmaconnect-sites/{tenant}/current/

include /etc/nginx/conf.d/pharmaconnect-customer-hosts.conf;

map $http_host $managed_tenant_slug {
    ~^(?<slug>[a-z0-9-]+)\.sites\.pharmaconnect\.uk$ $slug;
    default "";
}

server {
    listen 127.0.0.1:9080;
    server_name ~^[a-z0-9-]+\.sites\.pharmaconnect\.uk$ ~^local\.[a-z0-9.-]+$;

    autoindex off;

    set $tenant_slug $managed_tenant_slug;
    if ($tenant_slug = "") {
        set $tenant_slug $customer_tenant_slug;
    }

    if ($tenant_slug = "") {
        return 404;
    }

    if ($tenant_slug ~ "\.\.") {
        return 400;
    }

    if ($tenant_slug ~ "[^a-z0-9-]") {
        return 404;
    }

    set $tenant_root /var/www/pharmaconnect-sites/$tenant_slug/current;
    root $tenant_root;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* ^/(releases|logs|previous)(/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
